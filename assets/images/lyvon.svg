<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="lyvonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="speedGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#lyvonBg)"/>

  <!-- E-commerce Grid Background Lines -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.06">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>

  <!-- Container -->
  <rect x="70" y="45" width="460" height="270" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="70" y="45" width="460" height="36" rx="14" fill="#09090b"/>
  <circle cx="95" cy="63" r="5" fill="#ef4444"/>
  <circle cx="112" cy="63" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="63" r="5" fill="#10b981"/>
  <text x="300" y="68" fill="#e4e4e7" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">LYVON • D2C STOREFRONT ARCHITECTURE</text>

  <!-- Left: Apparel Storefront Preview -->
  <rect x="95" y="100" width="220" height="195" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>
  
  <!-- Minimalist Apparel Mockup -->
  <rect x="110" y="115" width="190" height="110" rx="6" fill="#18181b"/>
  <path d="M175 130 C185 138 225 138 235 130 L255 145 L245 165 L232 155 V215 H178 V155 L165 165 L155 145 Z" fill="#e4e4e7" opacity="0.9"/>
  <!-- Price & Cart pill -->
  <rect x="110" y="238" width="190" height="32" rx="6" fill="url(#amberGold)"/>
  <text x="205" y="259" fill="#000000" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">⚡ ONE-CLICK CHECKOUT</text>

  <!-- Right: Lighthouse 95+ and Core Web Vitals -->
  <rect x="330" y="100" width="180" height="195" rx="8" fill="#27272a" stroke="#52525b" stroke-width="1"/>

  <!-- Lighthouse Score Ring -->
  <rect x="345" y="112" width="150" height="52" rx="6" fill="#18181b" stroke="#10b981" stroke-width="1"/>
  <circle cx="372" cy="138" r="16" fill="none" stroke="#065f46" stroke-width="3"/>
  <circle cx="372" cy="138" r="16" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="90 10"/>
  <text x="372" y="143" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">98</text>
  <text x="400" y="132" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Lighthouse 95+</text>
  <text x="400" y="148" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9">LCP &lt;1.8s · CLS &lt;0.05</text>

  <rect x="345" y="172" width="150" height="48" rx="6" fill="#18181b" stroke="#f59e0b" stroke-width="1"/>
  <text x="355" y="189" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">+40% Click-Through</text>
  <text x="355" y="205" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9">10K+ Monthly Unique Visits</text>

  <rect x="345" y="228" width="150" height="48" rx="6" fill="#18181b" stroke="#60a5fa" stroke-width="1"/>
  <text x="355" y="245" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11" font-weight="700">-25% Abandonment</text>
  <text x="355" y="261" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="9">Payment-link checkout flow</text>
</svg>
