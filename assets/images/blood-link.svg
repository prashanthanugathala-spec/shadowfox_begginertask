<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bloodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="mapGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#bloodBg)"/>

  <!-- Radar / Map circles -->
  <g stroke="#ef4444" stroke-width="1" opacity="0.2">
    <circle cx="300" cy="180" r="60"/>
    <circle cx="300" cy="180" r="120"/>
    <circle cx="300" cy="180" r="180"/>
  </g>

  <!-- Browser container -->
  <rect x="70" y="45" width="460" height="270" rx="14" fill="url(#mapGlow)" stroke="#7f1d1d" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="70" y="45" width="460" height="36" rx="14" fill="#030712"/>
  <circle cx="95" cy="63" r="5" fill="#ef4444"/>
  <circle cx="112" cy="63" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="63" r="5" fill="#10b981"/>
  <text x="300" y="68" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">BloodLink • Real-Time Donor Dispatch &amp; Matching</text>

  <!-- Left Side: Radar Dispatch -->
  <rect x="95" y="100" width="220" height="195" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Map path simulation -->
  <path d="M120 220 Q160 140 220 180 T280 130" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4 4"/>
  <!-- Pin 1: Hospital -->
  <circle cx="120" cy="220" r="10" fill="#dc2626"/>
  <text x="120" y="224" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">H</text>
  <!-- Pin 2: Matched Donor -->
  <circle cx="280" cy="130" r="12" fill="#22c55e"/>
  <circle cx="280" cy="130" r="18" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.6"/>
  <text x="280" y="134" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="900" text-anchor="middle">✓</text>
  
  <rect x="110" y="112" width="105" height="22" rx="4" fill="#7f1d1d"/>
  <text x="162" y="127" fill="#fecaca" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">⏱ &lt; 2m MATCH TIME</text>

  <!-- Right Side: Metrics & Leaderboard -->
  <rect x="330" y="100" width="180" height="195" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  
  <rect x="345" y="115" width="150" height="48" rx="6" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
  <text x="355" y="132" fill="#86efac" font-family="system-ui, sans-serif" font-size="11" font-weight="700">+65% Better Match Rate</text>
  <text x="355" y="148" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Urgent ICU queries resolved</text>

  <rect x="345" y="172" width="150" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="355" y="189" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100% Request Coverage</text>
  <text x="355" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Automated blood-bank fallback</text>

  <rect x="345" y="228" width="150" height="52" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1"/>
  <text x="355" y="245" fill="#fde047" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🏆 +55% Repeat Signups</text>
  <text x="355" y="261" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Gamified badges &amp; alerts</text>
</svg>
