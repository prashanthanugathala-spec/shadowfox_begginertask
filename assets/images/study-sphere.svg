<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="360" rx="16" fill="url(#bg)"/>

  <!-- Grid Glow Lines -->
  <g stroke="#8b5cf6" stroke-width="0.75" opacity="0.15">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>

  <!-- Central App Interface Mockup -->
  <rect x="70" y="45" width="460" height="270" rx="14" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="70" y="45" width="460" height="36" rx="14" fill="#090d16"/>
  <circle cx="95" cy="63" r="5" fill="#ef4444"/>
  <circle cx="112" cy="63" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="63" r="5" fill="#10b981"/>
  <text x="300" y="68" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">StudySphere • GenAI Document Synthesizer</text>

  <!-- Left Panel: Document Upload & Summary -->
  <rect x="90" y="100" width="180" height="195" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <rect x="105" y="115" width="42" height="18" rx="4" fill="url(#purple)"/>
  <text x="126" y="128" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AI SUMMARY</text>
  
  <rect x="105" y="145" width="150" height="6" rx="3" fill="#cbd5e1" opacity="0.8"/>
  <rect x="105" y="160" width="130" height="6" rx="3" fill="#cbd5e1" opacity="0.6"/>
  <rect x="105" y="175" width="140" height="6" rx="3" fill="#cbd5e1" opacity="0.6"/>
  <rect x="105" y="190" width="110" height="6" rx="3" fill="#cbd5e1" opacity="0.6"/>

  <rect x="105" y="215" width="150" height="65" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="180" y="242" fill="#a855f7" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ 90s Engine</text>
  <text x="180" y="262" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">100+ page PDF ingested</text>

  <!-- Right Panel: Adaptive Quizzes & Flashcards -->
  <rect x="290" y="100" width="220" height="195" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  
  <!-- Quiz Card -->
  <rect x="305" y="115" width="190" height="75" rx="6" fill="#0f172a"/>
  <text x="318" y="132" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Adaptive Quiz: Level Medium</text>
  <rect x="318" y="145" width="164" height="18" rx="4" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="328" y="158" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="600">✓ 92% Question Relevance</text>
  <rect x="318" y="170" width="100" height="12" rx="3" fill="#334155"/>

  <!-- Flashcard Component -->
  <rect x="305" y="202" width="190" height="78" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
  <text x="318" y="222" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Spaced Repetition Flashcards</text>
  <text x="318" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">+45% Daily Active Usage</text>
  <!-- Progress bar -->
  <rect x="318" y="255" width="164" height="6" rx="3" fill="#334155"/>
  <rect x="318" y="255" width="125" height="6" rx="3" fill="#06b6d4"/>
</svg>
