<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="halo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8b195"/>
      <stop offset="100%" stop-color="#e27d60"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern in background -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
  </g>

  <!-- Glowing Aura Ring -->
  <circle cx="200" cy="180" r="115" fill="none" stroke="url(#halo)" stroke-width="4" stroke-dasharray="14 8" opacity="0.75" filter="url(#glow)"/>
  
  <!-- Developer Avatar -->
  <!-- Shoulders / Torso -->
  <path d="M110 370 C110 300 145 270 200 270 C255 270 290 300 290 370 Z" fill="url(#shirt)"/>
  <!-- Hoodie collar detail -->
  <path d="M175 270 L200 305 L225 270 Z" fill="#312e81"/>
  <path d="M196 305 L200 360 L204 360 L204 305 Z" fill="#6366f1" opacity="0.6"/>

  <!-- Neck -->
  <rect x="184" y="225" width="32" height="48" rx="6" fill="#df785d"/>

  <!-- Head -->
  <ellipse cx="200" cy="170" rx="55" ry="68" fill="url(#skin)"/>
  
  <!-- Modern Hair Style -->
  <path d="M142 165 C138 120 160 90 205 90 C245 90 262 115 258 145 C250 130 235 120 200 120 C165 120 150 145 142 165 Z" fill="#1e1b2e"/>
  <path d="M142 165 C142 135 155 105 190 98 C220 92 255 100 258 135 C255 120 240 108 215 108 C175 108 152 130 142 165 Z" fill="#2d2a45"/>

  <!-- Glasses -->
  <rect x="156" y="152" width="38" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
  <rect x="206" y="152" width="38" height="26" rx="6" fill="none" stroke="#0f172a" stroke-width="4"/>
  <line x1="194" y1="165" x2="206" y2="165" stroke="#0f172a" stroke-width="4"/>
  <!-- Glint on glasses -->
  <line x1="162" y1="158" x2="174" y2="170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <line x1="212" y1="158" x2="224" y2="170" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Smile -->
  <path d="M185 205 Q200 220 215 205" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round"/>

  <!-- Laptop edge in front -->
  <path d="M120 375 L280 375 L295 400 L105 400 Z" fill="#334155"/>
  <line x1="180" y1="375" x2="220" y2="375" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Code Floating Badges -->
  <g filter="url(#glow)">
    <!-- React Badge -->
    <rect x="42" y="110" width="76" height="34" rx="17" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="80" y="132" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">&lt;React /&gt;</text>
    
    <!-- JS Badge -->
    <rect x="290" y="130" width="68" height="34" rx="17" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
    <text x="324" y="152" fill="#facc15" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">{ JS }</text>

    <!-- AI / Full-Stack Badge -->
    <rect x="270" y="235" width="85" height="34" rx="17" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="312" y="257" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✦ GenAI</text>
  </g>
</svg>
