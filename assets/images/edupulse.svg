<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="eduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#eduBg)"/>

  <!-- Scanning grid line -->
  <g stroke="#10b981" stroke-width="0.8" opacity="0.15">
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
  </g>

  <!-- Container -->
  <rect x="70" y="45" width="460" height="270" rx="14" fill="#091b19" stroke="#0f766e" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="70" y="45" width="460" height="36" rx="14" fill="#041513"/>
  <circle cx="95" cy="63" r="5" fill="#ef4444"/>
  <circle cx="112" cy="63" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="63" r="5" fill="#10b981"/>
  <text x="300" y="68" fill="#5eead4" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">EduPulse • Real-Time Computer Vision Attendance &amp; Engagement</text>

  <!-- Left: Live camera feed mockup with face bounding box -->
  <rect x="95" y="100" width="220" height="195" rx="8" fill="#061f1c" stroke="#134e4a" stroke-width="1"/>
  <!-- Simulated face silhouette -->
  <ellipse cx="205" cy="185" rx="42" ry="52" fill="#0e3f3a"/>
  <!-- OpenCV green bounding box with corners -->
  <rect x="155" y="125" width="100" height="115" rx="4" fill="none" stroke="#22c55e" stroke-width="2"/>
  <!-- Corner marks -->
  <path d="M150 135 V120 H165" fill="none" stroke="#34d399" stroke-width="3"/>
  <path d="M260 135 V120 H245" fill="none" stroke="#34d399" stroke-width="3"/>
  <path d="M150 230 V245 H165" fill="none" stroke="#34d399" stroke-width="3"/>
  <path d="M260 230 V245 H245" fill="none" stroke="#34d399" stroke-width="3"/>
  <!-- Tag -->
  <rect x="155" y="106" width="100" height="18" rx="3" fill="#15803d"/>
  <text x="205" y="119" fill="#ffffff" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">STUDENT_ID #41 [96%]</text>

  <!-- Bottom status pill -->
  <rect x="110" y="260" width="190" height="22" rx="4" fill="#042f2e" stroke="#059669" stroke-width="1"/>
  <text x="205" y="275" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">🎯 60+ Students &lt;30s Batch</text>

  <!-- Right: Metrics & Analytics -->
  <rect x="330" y="100" width="180" height="195" rx="8" fill="#0b2926" stroke="#115e59" stroke-width="1"/>
  
  <rect x="345" y="115" width="150" height="48" rx="6" fill="#041f1c" stroke="#2dd4bf" stroke-width="1"/>
  <text x="355" y="132" fill="#2dd4bf" font-family="system-ui, sans-serif" font-size="11" font-weight="700">96% Recognition Acc</text>
  <text x="355" y="148" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="9">Saving 5+ faculty hrs/week</text>

  <rect x="345" y="172" width="150" height="48" rx="6" fill="#041f1c" stroke="#10b981" stroke-width="1"/>
  <text x="355" y="189" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ 15 FPS Real-Time</text>
  <text x="355" y="205" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="9">OpenCV tracking pipeline</text>

  <rect x="345" y="228" width="150" height="48" rx="6" fill="#041f1c" stroke="#34d399" stroke-width="1"/>
  <text x="355" y="245" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">-30% False Positives</text>
  <text x="355" y="261" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="9">Adaptive lighting filter</text>
</svg>
